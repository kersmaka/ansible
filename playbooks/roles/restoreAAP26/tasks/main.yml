- name: Slurp aap public key from ansible.homelab.com
  slurp:
    src: /home/aap/.ssh/id_rsa.pub
  register: ansible_aap_pubkey
  delegate_to: ansible.homelab.com
  become_user: aap

- name: "Ensure aap user exists on {{ target }}"
  ansible.builtin.user:
    name: aap
    state: present
    create_home: yes
    shell: /bin/bash
  become: true

- name: Grant aap passwordless sudo on restore target
  ansible.builtin.copy:
    dest: /etc/sudoers.d/aap
    content: "aap ALL=(ALL) NOPASSWD:ALL\n"
    mode: '0440'
    validate: 'visudo -cf %s'
  become: true

- name: Ensure required packages are installed on restore target
  ansible.builtin.package:
    name:
      - ansible-core
      - podman
      - containers-common
    state: present
  become: true

- name: "Inject ansible aap public key into {{ target }} authorized_keys"
  authorized_key:
    user: aap
    state: present
    key: "{{ ansible_aap_pubkey.content | b64decode }}"

# Facts are gathered for the play host (target), so read the IP from hostvars[target].
- name: "Add {{ target }} to /etc/hosts on ansible.homelab.com"
  lineinfile:
    path: /etc/hosts
    line: "{{ hostvars[target]['ansible_host'] | default(hostvars[target]['ansible_default_ipv4']['address']) }} {{ target }}"
    regexp: '.*{{ target | regex_escape }}.*'
    state: present
  become: true
  delegate_to: ansible.homelab.com

- name: Create AAP backup tarball on ansible.homelab.com
  delegate_to: ansible.homelab.com
  become_user: aap
  shell: >
    tar -czf /home/aap/aap-backup-manual.tar.gz
    /home/aap/ansible-automation-platform-containerized-setup-bundle-2.6-7-x86_64/backups/
  args:
    executable: /bin/bash

- name: "SCP backup from ansible to {{ target }}"
  delegate_to: ansible.homelab.com
  become_user: aap
  shell: >
    scp
    -o StrictHostKeyChecking=no
    -o BatchMode=yes
    -o ConnectTimeout=30
    /home/aap/aap-backup-manual.tar.gz
    aap@{{ target }}:/home/aap/aap-backup-manual.tar.gz
  args:
    executable: /bin/bash
  async: 3600
  poll: 30

# ── 1. Prepare the bundle backup directory ────────────────────────────────
- name: Ensure the backups directory exists in the bundle
  file:
    path: /home/aap/ansible-automation-platform-containerized-setup-bundle-2.6-7-x86_64/backups
    state: directory
    owner: aap
    group: aap
    mode: '0755'

# ── 2. Extract and Flatten ────────────────────────────────────────────────
- name: Extract manual backup into the bundle backups folder
  unarchive:
    src: /home/aap/aap-backup-manual.tar.gz
    dest: /home/aap/ansible-automation-platform-containerized-setup-bundle-2.6-7-x86_64/backups/
    remote_src: yes
    extra_opts: ['--strip-components=4']  # Strips: home/aap/<bundle-2.6-7>/backups/ leaving files flat
    owner: aap
    group: aap

- name: Rename backup artifacts to match the destination hostname
  ansible.builtin.shell: |
    for file in *ansible.homelab.com*; do
      [ -e "$file" ] || continue
      mv "$file" "${file//ansible.homelab.com/$TARGET_HOST}"
    done
  args:
    executable: /bin/bash
    chdir: /home/aap/ansible-automation-platform-containerized-setup-bundle-2.6-7-x86_64/backups/
  environment:
    TARGET_HOST: "{{ target }}"

# ── 3. Enable lingering for aap user ───────────────────────────────────────
- name: Enable lingering for aap user
  command: loginctl enable-linger aap

# ── 4. Get aap user UID ────────────────────────────────────────────────────
- name: Get aap user UID
  command: id -u aap
  register: aap_uid
  changed_when: false

- name: Sync bundle scaffolding (ansible.cfg, inventory, collections) to restore target
  ansible.posix.synchronize:
    src: "/home/aap/{{ aap_bundle_dir }}/"
    dest: "aap@{{ target }}:/home/aap/{{ aap_bundle_dir }}/"
    rsync_opts:
      - "--exclude=backups"
  become: false
  delegate_to: ansible.homelab.com

- name: Update inventory hostname references for restore target
  ansible.builtin.replace:
    path: /home/aap/{{ aap_bundle_dir }}/inventory
    regexp: 'ansible\.homelab\.com'
    replace: "{{ target }}"

- name: Sync SSL directory to restore target
  ansible.posix.synchronize:
    src: "/home/aap/ssl/"
    dest: "aap@{{ target }}:/home/aap/ssl/"
  become: false
  delegate_to: ansible.homelab.com

- name: Execute Containerized Restore
  shell: >
    ansible-playbook -i /home/aap/setup/inventory
    ansible.containerized_installer.restore
    -e "backup_dir=/home/aap/{{ aap_bundle_dir }}"
  args:
    chdir: /home/aap/ansible-automation-platform-containerized-setup-bundle-2.6-7-x86_64
  become_user: aap
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ aap_uid.stdout }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ aap_uid.stdout }}/bus"