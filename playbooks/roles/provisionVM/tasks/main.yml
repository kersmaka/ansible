---
- name: Ensure destination directory exists
  ansible.builtin.file:
    path: "/home/ansible_admin/vms/qcow2/"
    state: directory
    mode: '0755'

# rc != 0 is the expected "VM doesn't exist yet" case, so don't let it show as a failure.
- name: Check if VM already exists
  ansible.builtin.command: virsh dominfo {{ vm_name }}
  register: vm_check
  failed_when: false
  changed_when: false

- name: Report that the VM already exists
  ansible.builtin.debug:
    msg: "{{ vm_name }} already exists, skipping provisioning. Destroy and undefine it first to rebuild."
  when: vm_check.rc == 0

- name: Copy and Configure VM
  block:
    # Lock the guest to the minor release in the source image's filename
    # (rhel-9.4-x86_64-kvm.qcow2 -> 9.4). Without a release lock, "dnf update" moves a registered
    # guest to the newest 9.x minor. Only the basename is used, and the pattern avoids backslashes.
    - name: Derive RHEL minor release from source_image
      ansible.builtin.set_fact:
        rhel_release: "{{ source_image | basename | regex_findall('rhel-([0-9]+[.][0-9]+)') | first | default('', true) }}"

    - name: Verify a release was found in the source_image filename
      ansible.builtin.assert:
        that: rhel_release | length > 0
        fail_msg: >-
          Could not find a release like 'rhel-9.4' in the file name of source_image
          ({{ source_image }}). Name the image rhel-<major>.<minor>-..., e.g. rhel-9.4-x86_64-kvm.qcow2.
        quiet: true

    - name: Verify vm_selinux_mode is supported
      ansible.builtin.assert:
        that: (vm_selinux_mode | default('permissive')) in ['permissive', 'disabled']
        fail_msg: >-
          vm_selinux_mode must be 'permissive' or 'disabled' (got '{{ vm_selinux_mode | default('permissive') }}').
          Enforcing needs a working image relabel, which this build can't do.
        quiet: true

    - name: Copy qcow2 image
      ansible.builtin.copy:
        src: "{{ source_image }}"
        dest: "{{ dest_image }}.orig"
        remote_src: true
        force: false

    - name: Create empty 40G target disk
      ansible.builtin.command: "qemu-img create -f qcow2 {{ dest_image }} 40G"

    - name: Resize partitions to fill 40G
      ansible.builtin.command: "virt-resize --expand /dev/vda4 {{ dest_image }}.orig {{ dest_image }}"

    - name: Cleanup temporary image
      ansible.builtin.file:
        path: "{{ dest_image }}.orig"
        state: absent

    # no_log: the RH password is part of the command line and would be printed on failure.
    # Flip it to false temporarily if you need virt-customize's error output.
    # The root password and the sshd drop-in make the bootstrap below independent of whatever the
    # base image ships with. The 00- prefix makes sshd read it before any other drop-in, and sshd
    # uses the first value it sees for each option. Set vm_root_password (e.g. from the vault)
    # to override the default.
    # SELinux is set to permissive (or disabled) on purpose. dnf runs inside the libguestfs
    # appliance, which has no SELinux, so updated packages (openssh, systemd) land unlabeled, and
    # libguestfs on this KVM host only leaves a /.autorelabel note instead of relabelling. The RHEL
    # 9.4 guest then crashes on that note (selinux-autorelabel-generator SEGV), so nothing is ever
    # relabelled and an enforcing sshd runs as kernel_t and drops every login ("setcon failed").
    # Don't add --selinux-relabel back unless the host can really relabel (policycoreutils).
    - name: Inject Configuration (Hostname, Root Login, Subscription, Updates)
      ansible.builtin.command: >
        virt-customize -a {{ dest_image }}
        --hostname {{ vm_name }}
        --root-password 'password:{{ vm_root_password | default('redhat') }}'
        --run-command "echo 'PermitRootLogin yes' > /etc/ssh/sshd_config.d/00-rootlogin.conf"
        --run-command "echo 'PasswordAuthentication yes' >> /etc/ssh/sshd_config.d/00-rootlogin.conf"
        --run-command "subscription-manager register --force --username {{ vault_rh_user }} --password '{{ vault_rh_password }}'"
        --run-command "subscription-manager release --set={{ rhel_release }}"
        --run-command "dnf update -y"
        --run-command "dnf install vim -y"
        --run-command "sed -i 's/^SELINUX=.*/SELINUX={{ vm_selinux_mode | default('permissive') }}/' /etc/selinux/config"
      no_log: true

    - name: Run virt-install
      ansible.builtin.command: >
        virt-install --name {{ vm_name }} --ram {{ vm_memory }} --vcpus {{ vm_vcpus }}
        --disk path={{ dest_image }},format=qcow2 --import --os-variant rhel9.0
        --network network=br0-network --graphics none --noautoconsole

    - name: Wait for initialization
      ansible.builtin.pause:
        seconds: 60

    # Drop any old entry for this name so the add further down starts clean.
    - name: Remove stale /etc/hosts entry for the new VM
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '^\S+\s+{{ vm_name | regex_escape }}\s*$'
        state: absent
      become: true

    - name: Get VM IP
      ansible.builtin.shell: "/home/tools/ipCheck.sh {{ vm_name }}"
      register: ip_output

    - name: Debug IP output
      ansible.builtin.debug:
        msg: "{{ ip_output.stdout }}"

    # Parse the IP once, from this VM's block of the output only (blocks are separated by '---'),
    # so another VM's address can never be picked up by mistake. The patterns deliberately use
    # [0-9] and [.] instead of backslash escapes, which template differently across Ansible versions.
    - name: Set VM IP fact
      ansible.builtin.set_fact:
        vm_ip: >-
          {{ ip_output.stdout.split('---')
             | select('search', 'VM: ' ~ (vm_name | regex_escape) ~ '([^A-Za-z0-9_.-]|$)')
             | map('regex_findall', 'IP: ([0-9]{1,3}[.][0-9]{1,3}[.][0-9]{1,3}[.][0-9]{1,3})')
             | flatten
             | first
             | default('', true) }}

    - name: Verify a numeric IP was found for the new VM
      ansible.builtin.assert:
        that: vm_ip | length > 0
        fail_msg: >-
          No numeric IP found for {{ vm_name }} in the ipCheck.sh output. Either the VM has no DHCP
          lease yet, or ipCheck.sh printed a hostname because nmap reverse-resolved the address.
          Make sure the nmap call in /home/tools/ipCheck.sh uses -n.
        quiet: true

    - name: Add new VM to /etc/hosts on kvm_host
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '^\S+\s+{{ vm_name | regex_escape }}\s*$'
        line: "{{ vm_ip }}    {{ vm_name }}"
        state: present
      become: true

    - name: Ensure .ssh directory exists for runner
      ansible.builtin.file:
        path: /home/runner/.ssh
        state: directory
        mode: '0700'

    - name: Generate SSH key for runner if not present
      ansible.builtin.command:
        cmd: ssh-keygen -t rsa -b 4096 -f /home/runner/.ssh/id_rsa -N ""
        creates: /home/runner/.ssh/id_rsa

    - name: Install sshpass
      ansible.builtin.package:
        name: sshpass
        state: present

    # The fixed pause above isn't a guarantee: don't bootstrap until sshd is actually answering.
    - name: Wait for SSH on the new VM
      ansible.builtin.wait_for:
        host: "{{ vm_ip }}"
        port: 22
        search_regex: OpenSSH
        timeout: 180

    # A reused DHCP address or rebuilt VM has a new host key. ssh refuses password auth when a
    # conflicting key is on file, even with StrictHostKeyChecking=no, so clear old entries first.
    # loop_var is set because this role is run from a loop that already uses 'item'.
    - name: Remove stale host keys for the new VM
      ansible.builtin.known_hosts:
        name: "{{ kh.0 }}"
        path: "{{ kh.1 }}"
        state: absent
      loop: "{{ [vm_ip, vm_name] | product(['/root/.ssh/known_hosts', '/home/runner/.ssh/known_hosts']) | list }}"
      loop_control:
        loop_var: kh

    # The password is passed via SSHPASS (sshpass -e) instead of on the command line, so a failure
    # shows ssh's real error without exposing it. Don't add no_log here: it hides that error.
    - name: Bootstrap SSH trust to new VM
      ansible.builtin.command:
        argv:
          - sshpass
          - "-e"
          - ssh-copy-id
          - "-i"
          - /home/runner/.ssh/id_rsa.pub
          - "-o"
          - StrictHostKeyChecking=no
          - "-o"
          - ConnectTimeout=15
          - "root@{{ vm_ip }}"
      environment:
        SSHPASS: "{{ vm_root_password | default('redhat') }}"
      # A freshly booted guest can still be restarting sshd or finishing first-boot work, which
      # drops the connection mid-login. Retry those drops for up to 3 minutes, but stop at once
      # on a real authentication failure so a bad password doesn't wait out the whole window.
      register: ssh_bootstrap
      retries: 18
      delay: 10
      until: ssh_bootstrap.rc == 0 or 'Permission denied' in (ssh_bootstrap.stderr | default(''))

    - name: Inject AAP machine credential key into new VM
      ansible.posix.authorized_key:
        user: root
        state: present
        key: "{{ pubkey }}"
      loop:
        - "{{ kvm_host_root_pubkey }}"
        - "{{ aap_container_pubkey }}"
      loop_control:
        loop_var: pubkey
      delegate_to: "{{ vm_ip }}"
      vars:
        ansible_user: root
        ansible_password: "{{ vm_root_password | default('redhat') }}"
        ansible_ssh_common_args: '-o StrictHostKeyChecking=no'

    - name: Generate SSH key on localhost if not present
      ansible.builtin.command:
        cmd: ssh-keygen -t rsa -b 4096 -f /root/.ssh/id_rsa -N ""
        creates: /root/.ssh/id_rsa
      delegate_to: localhost

    - name: Slurp ansible.homelab.com public key
      ansible.builtin.slurp:
        src: /root/.ssh/id_rsa.pub
      register: ansible_host_pubkey
      delegate_to: localhost

    - name: Inject ansible.homelab.com key into new VM authorized_keys
      ansible.posix.authorized_key:
        user: root
        state: present
        key: "{{ ansible_host_pubkey['content'] | b64decode }}"
      delegate_to: "{{ vm_ip }}"
      vars:
        ansible_user: root
        ansible_password: "{{ vm_root_password | default('redhat') }}"
        ansible_ssh_common_args: '-o StrictHostKeyChecking=no'

  when: vm_check.rc != 0

- name: Share IP and VM status with subsequent plays
  ansible.builtin.set_stats:
    data:
      new_vm_ip: "{{ vm_ip }}"
      vm_already_existed: "{{ vm_check.rc == 0 }}"
  when: vm_check.rc != 0 and vm_ip is defined