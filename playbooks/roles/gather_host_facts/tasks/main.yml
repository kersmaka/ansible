---
- name: Ensure output directory exists on control node
  ansible.builtin.file:
    path: "{{ facts_output_dir }}"
    state: directory
  delegate_to: localhost
  run_once: true

- name: Gather facts explicitly if not already collected
  ansible.builtin.setup:

- name: Build limited fact set
  ansible.builtin.set_fact:
    limited_facts:
      hostname: "{{ ansible_facts.hostname }}"
      ip_address: "{{ ansible_facts.default_ipv4.address | default(ansible_facts.all_ipv4_addresses | default([]) | first | default(omit)) }}"
      kernel: "{{ ansible_facts.kernel }}"

- name: Write limited host facts to a local JSON file
  ansible.builtin.copy:
    content: "{{ limited_facts | to_nice_json }}"
    dest: "{{ facts_output_dir }}/{{ inventory_hostname }}.json"
    mode: '0644'
  delegate_to: localhost